<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        ul{
            background-color: rgb(88, 142, 243);
            overflow: hidden;
            margin: 0;
            padding: 0;
            list-style-type: none;
        }
        ul li{
            float: left;
        }
        li a{
            text-decoration: none;
            padding: 8px 6px;
            color: white;
            border-right: 1px solid white;
        }
        li a:hover{
            background-color: white;
            color: rgb(88, 142, 243);
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Services</a></li>
        <li><a href="">Contact</a></li>
    </ul>
</body>
</html>
