<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <div id="myid">Hi</div> -->
    <button id="myid">Hi</button>
    <script>
        let ctr=document.getElementById("myid");
        function fn(){
            ctr.innerHTML="Welcome !!!";
        }
        ctr.addEventListener("click",fn);
        ctr.removeEventListener("click",fn);
    </script>
</body>
</html>
